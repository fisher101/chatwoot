name: Build and Push Custom Chatwoot

# 触发条件：当推送到 develop 分支，或者在网页端手动点击运行 时触发
on:
  push:
    branches:
      - develop  # 如果你的默认分支叫 main/master，请将其改为 main/master
  workflow_dispatch: 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      # 1. 拉取你的最新代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 设置 Docker 的构建环境
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. 登录到 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. 核心步骤：基于代码库里的 Dockerfile 构建并推送镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          # 这里的 my-chatwoot 可以改成你自定义的镜像名称
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/chatwoot:latest
